{% extends 'base.html' %}{% block title %}Account management · CampusMove{% endblock %}{% block pageheading %}Account management{% endblock %}{% block content %}
<div class="admin-hero"><div><span class="eyebrow">IDENTITY & ACCESS</span><h1>Provision accounts</h1><p>Create administrator, parent and driver access credentials.</p></div></div>
<section class="panel"><form class="stack-form" method="post" action="/superadmin/create-user"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Account role<select name="role"><option value="admin">Administrator</option><option value="parent">Parent</option><option value="driver">Driver</option></select></label><label>Full name<input name="name" placeholder="Enter full name" required></label><label>Email / username<input name="identity" type="email" placeholder="name@example.com" required></label><label>Temporary password<input name="password" type="password" minlength="10" placeholder="At least 10 characters" required></label><button class="primary-button">＋ Provision account</button></form></section>{% endblock %}
