{% extends "base.html" %}{% block content %}<div class="formcard"><span class="tag">TRANSPORT APPLICATION</span><h2>Apply for a bus pass</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Route<select id="route" name="route_id" required><option value="">Choose route</option>{% for r in routes %}<option value="{{ r.id }}" data-stops="{{ r.stops }}">{{ r.route_name }} · Bus {{ r.bus_number }}</option>{% endfor %}</select></label><label>Pickup stop<select id="stop" name="pickup_stop" required><option value="">Select route first</option></select></label><button class="btn full">Submit application</button></form></div>{% endblock %}{% block scripts %}<script>document.getElementById('route').onchange=e=>{let s=document.getElementById('stop');s.innerHTML='';(e.target.selectedOptions[0].dataset.stops||'').split(',').forEach(x=>{x=x.trim();if(x){let o=document.createElement('option');o.value=x;o.textContent=x;s.append(o)}})}</script>{% endblock %}
